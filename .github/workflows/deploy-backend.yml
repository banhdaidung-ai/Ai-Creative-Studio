name: Deploy Flow Backend to Cloud Run

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công từ GitHub Web

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Build and Deploy to Cloud Run
        run: |
          gcloud builds submit flow-backend/ --tag gcr.io/${{ secrets.GCP_PROJECT_ID }}/flow-backend:latest
          gcloud run deploy flow-backend \
            --image gcr.io/${{ secrets.GCP_PROJECT_ID }}/flow-backend:latest \
            --platform managed \
            --region asia-southeast1 \
            --allow-unauthenticated \
            --min-instances 0 \
            --max-instances 2 \
            --memory 2Gi \
            --cpu 2 \
            --timeout 300 \
            --set-env-vars GOOGLE_FLOW_SESSION_B64="${{ secrets.GOOGLE_FLOW_SESSION_B64 }}"
